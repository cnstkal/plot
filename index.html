<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plot</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plot">
<meta name="theme-color" content="#f7f6f4">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  * { box-sizing:border-box; margin:0; padding:0; touch-action:manipulation; }
  body { font-family:'Pretendard',sans-serif; background:#f7f6f4; color:#2c2c2c; min-height:100vh; padding:24px 16px; }
  .wrap { max-width:520px; margin:0 auto; }
  h1 { font-size:20px; font-weight:700; margin-bottom:24px; }
  .card { margin-bottom:32px; }
  .card h2 { font-size:14px; font-weight:600; color:#888; margin-bottom:8px; }
  .rollbtn { width:100%; padding:16px; border-radius:14px; background:#2c2c2c; color:#fff; font-size:16px; font-weight:600; border:none; cursor:pointer; }
  .rollbtn:active { transform:scale(0.98); }
  .result { background:#fff; border-radius:16px; padding:24px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,0.05); min-height:80px; display:flex; flex-direction:column; justify-content:center; margin-top:10px; }
  .result .main { font-size:20px; font-weight:700; }
  .empty { color:#bbb; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>✍️ Plot</h1>

  <div class="card">
    <h2>장르</h2>
    <button class="rollbtn" onclick="rollGenre()">🎲 장르 뽑기</button>
    <div class="result" id="genreResult"><div class="empty">눌러서 뽑기</div></div>
  </div>

  <div class="card">
    <h2>공수</h2>
    <button class="rollbtn" onclick="rollPos()">🎲 공수 뽑기</button>
    <div class="result" id="posResult"><div class="empty">눌러서 뽑기</div></div>
  </div>

  <div class="card">
    <h2>판타지</h2>
    <button class="rollbtn" onclick="rollFantasy()">🎲 판타지 뽑기</button>
    <div class="result" id="fantasyResult"><div class="empty">눌러서 뽑기</div></div>
  </div>

  <div class="card">
    <h2>수위 키워드</h2>
    <button class="rollbtn" onclick="rollNsfw()">🎲 수위 키워드 뽑기</button>
    <div class="result" id="nsfwResult"><div class="empty">눌러서 뽑기</div></div>
  </div>
</div>

<script>
const genres = ["로맨스","현대","오피스","학원","무협","회귀","빙의","환생","오메가버스","군대","재벌","스포츠","의학","범죄","느와르","호러","좀비아포칼립스","포스트아포칼립스","초능력","히어로","SF","우주","타임루프","계약연애","정략결혼","가족","육아","브로맨스","일상","힐링","복수극","스릴러","밀실","재난","전쟁","스팀펑크","아카데미","연예계","사이버펑크","이혼","재혼","캠퍼스","네임버스","AI","키잡/역키잡","게임","센티넬버스","마법소녀","밴드","섹피","신화","사이비","구룡성채","해외","학교폭력","인신매매","정신병원"];


const nsfwKeywords = ["콘돔","순애","수면간","자위","임신","방치","관음","롤플레이","딥쓰롯","야외","근친","촉수","정신 개조","육변기","세뇌","가정폭력","딜도","펠라","난교","윤간","시오후키","감금","3P","NTR","납치","산란","주종관계","촬영","착유","스마타","파이즈리","문신","원홀투스틱","벽고","오나홀","코스튬","매춘","구속","하렘","결혼","스토킹","처녀상실","유부","후타나리","치한"];

const pos = ["대기업 후계자","대표","회사원","대학 교수","대학원생","의사","변호사","검사","형사","경찰","기자","배우","무명 배우","아이돌","아이돌 연습생","매니저","작가","편집자","화가","사진작가","셰프","바텐더","카페 사장","카페 직원","건물주","재벌","사생아","군인","전직 군인","운동선수","트레이너","체육관 관장","사채업자","사업가","조직 간부","조직의 후계자","사기꾼","도박사","카지노 운영자","대학생","가난한 집안","수의사","간호사","교사","서점 직원","음악가","길거리 공연자","프리랜서","백수","여행자","가출한 사람","몰락한 집안의 후계자","정치인","조직원","경호원","정보상","브로커","장의사","탐험가","마피아","갱스터","죄수","탈옥수","교도관","정치범","망명자","난민","숨겨진 후계자","입양아","인간이 아닌 존재","초능력자","능력자 관리기관 소속","실험체","복제인간","안드로이드","우주비행사","외계인","행성의 지배자","전쟁 영웅","독재자의 측근","반란군","혁명가","스파이","회귀자","환생자","흑막","유부남","싱글대디","보디가드","츤데레","여장남자","시한부","킬러","수인","인어","스트리머","해커","사신","가정부","임산부","디자이너","암살자","늑대인간","뱀파이어","교주","래퍼","멘헤라","벤츠남","똥차 컬렉터","마약중독자","아저씨","고등학생","이혼남","투견","GV배우","양아치","너드","인플루언서","스토커","영화감독"];

const fantasy = ["왕자","황태자","황제","공작","귀족","몰락 귀족","왕족","신하","기사단장","기사","마법사","대마법사","견습 마법사","성직자","사제","신관","예언자","용병","도적","상인","약초꾼","평민","마왕","마족","드래곤","뱀파이어","늑대인간","신","신의 사도","저주받은 인간","몰락한 왕족","악마","천사","반신","용사","성녀","불멸자","이세계인","다른 종족의 왕","신의 대리인","왕의 최측근","해적"];

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickTwo(arr){
  const i = Math.floor(Math.random()*arr.length);
  let j = Math.floor(Math.random()*(arr.length-1));
  if(j>=i) j++;
  return [arr[i], arr[j]];
}

function rollGenre(){
  document.getElementById('genreResult').innerHTML = `<div class="main">${pick(genres)}</div>`;
}
function rollPos(){
  const [a,b] = pickTwo(pos);
  document.getElementById('posResult').innerHTML = `<div class="main">${a} × ${b}</div>`;
}
function rollFantasy(){
  const [a,b] = pickTwo(fantasy);
  document.getElementById('fantasyResult').innerHTML = `<div class="main">${a} × ${b}</div>`;
}
function pickN(arr,n){
  const copy=[...arr], out=[];
  for(let k=0;k<n;k++){ out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]); }
  return out;
}
function rollNsfw(){
  document.getElementById('nsfwResult').innerHTML = `<div class="main">${pickN(nsfwKeywords,3).join(' · ')}</div>`;
}
</script>
</body>
</html>
