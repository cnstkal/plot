<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plot</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plot">
<meta name="theme-color" content="#faf8f5">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  * { box-sizing:border-box; margin:0; padding:0; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  html { background:#faf8f5; }
  body {
    font-family:'Pretendard',sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,214,196,0.35), transparent 45%),
      radial-gradient(circle at 100% 20%, rgba(196,214,255,0.3), transparent 40%),
      #faf8f5;
    color:#2a2622;
    min-height:100vh;
    padding:36px 18px 60px;
  }
  .wrap { max-width:520px; margin:0 auto; }

  .header { margin-bottom:20px; display:flex; align-items:center; gap:10px; }
  .header .emoji {
    width:40px; height:40px; border-radius:12px;
    background:linear-gradient(135deg,#ffb199,#c2a4ff);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    box-shadow:0 6px 14px rgba(194,164,255,0.35);
  }
  h1 { font-size:22px; font-weight:800; letter-spacing:-0.02em; }
  .header .sub { font-size:12px; color:#9a9184; font-weight:500; margin-top:1px; }
  .header .spacer { flex:1; }
  .iconbtn {
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:#fff; font-size:17px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(60,50,40,0.08);
    transition:transform .12s ease;
  }
  .iconbtn:active { transform:scale(0.92); }

  .oneclick {
    width:100%; padding:18px; margin-bottom:14px;
    border:none; border-radius:18px; cursor:pointer;
    background:linear-gradient(135deg,#2a2622,#4a433c);
    color:#fff; font-size:16px; font-weight:700; letter-spacing:-0.01em;
    box-shadow:0 10px 24px rgba(42,38,34,0.22);
    transition:transform .12s ease, box-shadow .12s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .oneclick:active { transform:scale(0.97); box-shadow:0 4px 12px rgba(42,38,34,0.22); }

  .savebar {
    width:100%; padding:14px; margin-bottom:30px;
    border-radius:16px; cursor:pointer;
    background:#fff; color:#4a433c; font-size:14px; font-weight:700;
    border:1.5px dashed #d8d0c2;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .12s ease, background .12s ease;
  }
  .savebar:active { transform:scale(0.97); background:#f5f2ec; }

  .section-label {
    font-size:12px; font-weight:700; color:#b0a898;
    letter-spacing:0.02em; margin:6px 2px 12px;
    display:flex; align-items:center; gap:8px;
  }
  .section-label::after {
    content:''; flex:1; height:1px; background:#e8e2d8;
  }

  .card {
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(60,50,40,0.05);
    border:1px solid rgba(0,0,0,0.03);
  }
  .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .card-head h2 { font-size:14px; font-weight:700; color:#4a433c; display:flex; align-items:center; gap:6px; }
  .card-head h2 .dot { width:6px; height:6px; border-radius:50%; }
  .card-head .btns { display:flex; gap:6px; }

  .genre .dot { background:#ff9d7a; }
  .character .dot { background:#7aa8ff; }
  .setting .dot { background:#6bc7a8; }
  .gongsu .dot { background:#e0a458; }
  .relationship .dot { background:#e07a9e; }
  .fantasy .dot { background:#b98aff; }
  .nsfw .dot { background:#ff6f91; }

  .rollbtn {
    padding:9px 16px; border-radius:100px; border:none; cursor:pointer;
    background:#f3f0eb; color:#4a433c; font-size:13px; font-weight:600;
    transition:background .12s ease, transform .12s ease;
  }
  .rollbtn:active { transform:scale(0.95); background:#e9e5dd; }

  .listbtn {
    padding:9px 12px; border-radius:100px; border:none; cursor:pointer;
    background:transparent; color:#b0a898; font-size:13px; font-weight:600;
    transition:background .12s ease, color .12s ease;
  }
  .listbtn:active { background:#f3f0eb; }
  .listbtn.active { background:#f3f0eb; color:#4a433c; }
  .lockbtn {
    width:34px; height:34px; border:none; border-radius:50%;
    background:#f3f0eb; color:#b0a898; cursor:pointer;
    font-size:13px; display:flex; align-items:center; justify-content:center;
    transition:background .12s ease, color .12s ease, transform .12s ease;
  }
  .lockbtn:active { transform:scale(.92); }
  .lockbtn.active { background:#2a2622; color:#fff; }


  .result {
    min-height:56px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    border-radius:14px;
    background:#faf8f5;
    padding:14px 12px;
  }
  .result .main {
    font-size:17px; font-weight:700; color:#2a2622;
    line-height:1.5;
    animation:pop .28s ease;
  }
  .character-pair {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .character-half {
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .character-label {
    font-size:12px;
    font-weight:700;
    color:#9a9184;
    padding-left:2px;
  }
  .character-half .result {
    min-width:0;
    padding:12px 8px;
  }
  .character-half .result .main {
    font-size:15px;
    word-break:keep-all;
  }
  .character-roll {
    width:100%;
    padding:8px 10px;
  }

  .result .main .x { color:#c7bfb2; font-weight:500; margin:0 4px; }
  .empty { color:#c2b9ac; font-size:13px; font-weight:500; }

  .chiplist {
    display:none;
    flex-wrap:wrap; gap:6px;
    margin-top:12px;
    padding-top:14px;
    border-top:1px dashed #ece7de;
  }
  .chiplist.open { display:flex; }
  .chip {
    border:none; cursor:pointer; font-family:inherit;
    font-size:12px; font-weight:500; color:#6b6255;
    background:#f5f2ec; border-radius:8px;
    padding:6px 10px;
  }
  .count {
    font-size:11px; color:#c2b9ac; font-weight:600;
    margin-top:2px;
  }

  @keyframes pop {
    from { opacity:0; transform:translateY(4px) scale(0.98); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }

  /* ── iOS 스타일 보관함 시트 ───────────────────── */
  .sheet-backdrop {
    position:fixed; inset:0; background:rgba(20,16,12,0.32);
    backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .22s ease;
    z-index:50;
  }
  .sheet-backdrop.open { opacity:1; pointer-events:auto; }
  .sheet {
    position:fixed; left:0; right:0; bottom:0;
    max-width:520px; margin:0 auto;
    background:#faf8f5;
    border-radius:24px 24px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,0.15);
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    z-index:51;
    max-height:86vh;
    display:flex; flex-direction:column;
  }
  .sheet.open { transform:translateY(0); }
  .sheet-handle { width:36px; height:5px; border-radius:3px; background:#e0d9cc; margin:10px auto 4px; flex-shrink:0; }
  .sheet-head {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px 14px; flex-shrink:0;
    border-bottom:1px solid #ece7de;
  }
  .sheet-head h3 { font-size:17px; font-weight:800; }
  .sheet-close {
    width:30px; height:30px; border-radius:50%; border:none; cursor:pointer;
    background:#efece5; color:#9a9184; font-size:15px; font-weight:700;
  }
  .sheet-body { overflow-y:auto; padding:16px 20px 30px; -webkit-overflow-scrolling:touch; }

  .save-item {
    background:#fff; border-radius:16px; padding:16px;
    margin-bottom:12px; box-shadow:0 2px 8px rgba(60,50,40,0.05);
    border:1px solid rgba(0,0,0,0.03);
  }
  .save-item .date { font-size:11px; color:#c2b9ac; font-weight:600; margin-bottom:8px; }
  .save-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .save-chip {
    display:flex; align-items:center; gap:5px;
    font-size:12.5px; font-weight:600; color:#4a433c;
    background:#f5f2ec; border-radius:100px;
    padding:6px 8px 6px 12px;
  }
  .save-chip .rm {
    width:16px; height:16px; border-radius:50%; border:none; cursor:pointer;
    background:#e5e0d5; color:#9a9184; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1;
    flex-shrink:0;
  }
  .save-memo {
    width:100%; border:none; background:#faf8f5; border-radius:10px;
    padding:10px 12px; font-size:13px; font-family:inherit; color:#4a433c;
    resize:none; min-height:72px; line-height:1.55; overflow:hidden; box-sizing:border-box;
  }
  .save-memo::placeholder { color:#c2b9ac; }
  .save-memo:focus { outline:2px solid #e8e2d8; background:#fff; }

  .save-item-foot { display:flex; justify-content:flex-end; margin-top:8px; }
  .save-del {
    border:none; background:transparent; cursor:pointer;
    color:#c99; font-size:12px; font-weight:600; padding:4px 6px;
  }
  .sheet-empty { text-align:center; color:#c2b9ac; font-size:13px; padding:60px 0; }

  .toast {
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px);
    background:#2a2622; color:#fff; font-size:13px; font-weight:600;
    padding:12px 20px; border-radius:100px; box-shadow:0 8px 20px rgba(0,0,0,0.2);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    z-index:60; white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .settings-btn {
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:#fff; font-size:17px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(60,50,40,0.08); transition:transform .12s ease;
  }
  .settings-btn:active { transform:scale(0.92); }
  .config-backdrop {
    position:fixed; inset:0; background:rgba(20,16,12,0.32); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:70;
  }
  .config-backdrop.open { opacity:1; pointer-events:auto; }
  .config-modal {
    position:fixed; left:50%; top:50%; width:min(520px,calc(100% - 28px)); max-height:82vh;
    transform:translate(-50%,-46%) scale(.98); background:#faf8f5; border-radius:24px;
    box-shadow:0 18px 50px rgba(0,0,0,.18); opacity:0; pointer-events:none;
    transition:opacity .22s ease,transform .22s ease; z-index:71; display:flex; flex-direction:column;
  }
  .config-modal.open { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  .config-head { display:flex; align-items:center; justify-content:space-between; padding:20px 20px 14px; border-bottom:1px solid #ece7de; flex-shrink:0; }
  .config-head h3 { font-size:17px; font-weight:800; }
  .config-close { width:30px; height:30px; border-radius:50%; border:none; cursor:pointer; background:#efece5; color:#9a9184; font-size:15px; font-weight:700; }
  .config-body { overflow-y:auto; padding:16px 20px 24px; }
  .config-note { font-size:12px; color:#9a9184; line-height:1.5; margin-bottom:16px; }
  .config-group { margin-bottom:20px; }
  .config-group-title { font-size:13px; font-weight:800; color:#4a433c; margin-bottom:9px; display:flex; align-items:center; justify-content:space-between; }
  .config-count { font-size:11px; color:#b0a898; font-weight:600; }
  .config-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .config-chip { border:1px solid #e5dfd5; background:#fff; color:#5e574d; border-radius:9px; padding:7px 10px; font:500 12px 'Pretendard',sans-serif; cursor:pointer; }
  .config-chip.off { color:#c2b9ac; background:#f0ede7; text-decoration:line-through; opacity:.72; }
  .config-add { display:flex; gap:7px; margin-top:9px; }
  .config-add input { min-width:0; flex:1; border:1px solid #e5dfd5; background:#fff; border-radius:10px; padding:9px 11px; font:500 12px 'Pretendard',sans-serif; color:#4a433c; outline:none; }
  .config-add button { border:none; border-radius:10px; padding:0 13px; background:#2a2622; color:#fff; font:700 12px 'Pretendard',sans-serif; cursor:pointer; }

</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="emoji">✍️</div>
    <div>
      <h1>Plot</h1>
      <div class="sub">랜덤 플롯 생성기</div>
    </div>
    <div class="spacer"></div>
    <button class="settings-btn" onclick="openConfig()" title="키워드 설정">⚙️</button>
    <button class="iconbtn" onclick="openSheet()" title="보관함">📌</button>
  </div>

  <button class="oneclick" onclick="rollGenre();rollRelationship();rollCharacterPair();rollGong();rollSu();rollSetting();rollFantasy();rollNsfw();">🎲 원클릭 뽑기</button>
  <button class="savebar" onclick="saveCurrent()">💾 지금 뽑은 키워드 저장</button>

  <div class="section-label">기본 요소</div>

  <div class="card genre">
    <div class="card-head">
      <h2><span class="dot"></span>장르</h2>
      <div class="btns">
        <button class="listbtn" id="genreListBtn" onclick="toggleList('genre')">목록</button>
        <button class="lockbtn" id="genreLockBtn" onclick="toggleLock('genre')" title="고정">🔒</button>
        <button class="rollbtn" onclick="rollGenre()">뽑기</button>
      </div>
    </div>
    <div class="result" id="genreResult"><div class="empty">눌러서 뽑기</div></div>
    <div class="chiplist" id="genreList"></div>
  </div>

  <div class="card relationship">
    <div class="card-head">
      <h2><span class="dot"></span>관계</h2>
      <div class="btns">
        <button class="listbtn" id="relationshipListBtn" onclick="toggleList('relationship')">목록</button>
        <button class="lockbtn" id="relationshipLockBtn" onclick="toggleLock('relationship')" title="고정">🔒</button>
        <button class="rollbtn" onclick="rollRelationship()">뽑기</button>
      </div>
    </div>
    <div class="result" id="relationshipResult"><div class="empty">눌러서 뽑기</div></div>
    <div class="chiplist" id="relationshipList"></div>
  </div>

  <div class="card character">
    <div class="card-head">
      <h2><span class="dot"></span>캐릭터</h2>
      <div class="btns">
        <button class="lockbtn" id="characterLockBtn" onclick="toggleLock('character')" title="고정">🔒</button>
      <button class="listbtn" id="characterListBtn" onclick="toggleList('character')">목록</button>
        <button class="rollbtn" onclick="rollCharacterPair()">같이 뽑기</button>
      </div>
    </div>
    <div class="character-pair">
      <div class="character-half">
        <div class="character-label">A</div>
        <div class="result" id="characterAResult"><div class="empty">눌러서 뽑기</div></div>
        <button class="rollbtn character-roll" onclick="rollCharacterA()">뽑기</button>
      </div>
      <div class="character-half">
        <div class="character-label">B</div>
        <div class="result" id="characterBResult"><div class="empty">눌러서 뽑기</div></div>
        <button class="rollbtn character-roll" onclick="rollCharacterB()">뽑기</button>
      </div>
    </div>
    <div class="chiplist" id="characterList"></div>
  </div>

  <div class="card gongsu">
    <div class="card-head">
      <h2><span class="dot"></span>공수</h2>
      <button class="lockbtn" id="gongsuLockBtn" onclick="toggleLock('gongsu')" title="고정">🔒</button>
      <button class="listbtn" id="gongsuListBtn" onclick="toggleList('gongsu')">목록</button>
    </div>
    <div class="character-pair">
      <div class="character-half">
        <div class="character-label">공</div>
        <div class="result" id="gongResult"><div class="empty">눌러서 뽑기</div></div>
        <button class="rollbtn character-roll" onclick="rollGong()">뽑기</button>
      </div>
      <div class="character-half">
        <div class="character-label">수</div>
        <div class="result" id="suResult"><div class="empty">눌러서 뽑기</div></div>
        <button class="rollbtn character-roll" onclick="rollSu()">뽑기</button>
      </div>
    </div>
    <div class="chiplist" id="gongsuList"></div>
  </div>

  <div class="card setting">
    <div class="card-head">
      <h2><span class="dot"></span>소재</h2>
      <div class="btns">
        <button class="listbtn" id="settingListBtn" onclick="toggleList('setting')">목록</button>
        <button class="lockbtn" id="settingLockBtn" onclick="toggleLock('setting')" title="고정">🔒</button>
        <button class="rollbtn" onclick="rollSetting()">뽑기</button>
      </div>
    </div>
    <div class="result" id="settingResult"><div class="empty">눌러서 뽑기</div></div>
    <div class="chiplist" id="settingList"></div>
  </div>

  <div class="section-label">플러스 요소</div>

  <div class="card fantasy">
    <div class="card-head">
      <h2><span class="dot"></span>판타지</h2>
      <div class="btns">
        <button class="listbtn" id="fantasyListBtn" onclick="toggleList('fantasy')">목록</button>
        <button class="lockbtn" id="fantasyLockBtn" onclick="toggleLock('fantasy')" title="고정">🔒</button>
        <button class="rollbtn" onclick="rollFantasy()">뽑기</button>
      </div>
    </div>
    <div class="result" id="fantasyResult"><div class="empty">눌러서 뽑기</div></div>
    <div class="chiplist" id="fantasyList"></div>
  </div>

  <div class="card nsfw">
    <div class="card-head">
      <h2><span class="dot"></span>수위 키워드</h2>
      <div class="btns">
        <button class="listbtn" id="nsfwListBtn" onclick="toggleList('nsfw')">목록</button>
        <button class="lockbtn" id="nsfwLockBtn" onclick="toggleLock('nsfw')" title="고정">🔒</button>
        <button class="rollbtn" onclick="rollNsfw()">뽑기</button>
      </div>
    </div>
    <div class="result" id="nsfwResult"><div class="empty">눌러서 뽑기</div></div>
    <div class="chiplist" id="nsfwList"></div>
  </div>

</div>

<!-- 키워드 설정 -->
<div class="config-backdrop" id="configBackdrop" onclick="closeConfig()"></div>
<div class="config-modal" id="configModal">
  <div class="config-head"><h3>⚙️ 키워드 설정</h3><button class="config-close" onclick="closeConfig()">✕</button></div>
  <div class="config-body" id="configBody"></div>
</div>

<!-- 보관함 시트 -->
<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3>📌 보관함</h3>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// 장르 - 작품 전체를 아우르는 분위기/톤
const genres = ["로맨스","현대","무협","오메가버스","스포츠","의학","범죄","느와르","좀비아포칼립스","포스트아포칼립스","초능력","히어로","SF","가족","육아","일상","힐링","스릴러","재난","전쟁","스팀펑크","사이버펑크","네임버스","AI","게임","센티넬버스","마법소녀","섹피","신화","해외","오피스","학원","연예계","재벌","서바이벌","헌터","시대","동양풍","서양풍"];

// 배경 - 이야기의 중심지가 되는 물리적/제도적 공간

const nsfwKeywords = ["콘돔","순애","수면간","자위","임신","방치","관음","롤플레이","딥쓰롯","야외","근친","촉수","정신 개조","육변기","세뇌","가정폭력","딜도","펠라","난교","윤간","시오후키","감금","3P","NTR","납치","산란","주종관계","촬영","착유","스마타","파이즈리","문신","원홀투스틱","벽고","오나홀","코스튬","매춘","구속","하렘","결혼","스토킹","처녀상실","유부","후타나리","치한"];

const gong = ["재벌공","집착공","계략공","강공","능글공","다정공","무심공","냉혈공","후회공","광공","개아가공","연하공","연상공","동갑공","미인공","순정공","짝사랑공","헌신공","능력공","복흑공","직진공","까칠공","츤데레공","상처공","절륜공","문란공","초딩공","대형견공","여우공","늑대공","알파공","귀염공","호구공","베타공","헤테로공"];
const su = ["연상수","연하수","다정수","무심수","까칠수","순진수","청순수","적극수","소심수","짝사랑수","헌신수","상처수","굴림수","도망수","임신수","능력수","계략수","복흑수","강수","문란수","대형견수","여우수","울보수","집착수","알파수","오메가수","베타수","얼빠수","외유내강수","군림수","공이었수","명랑수","햇살수","허당수","츤데레수","호구수"];

const data = { genre: genres, character: character, setting: settings, relationship: relationship, gong: gong, su: su, gongsu: gong.concat(su), fantasy: fantasy, nsfw: nsfwKeywords };
const current = {};
const disabled = JSON.parse(localStorage.getItem('plot_disabled') || '{}');
const locked = {};

function saveDisabled(){ localStorage.setItem('plot_disabled', JSON.stringify(disabled)); }

const configLabels = { genre:'장르', character:'캐릭터', setting:'배경', relationship:'관계', gong:'공', su:'수', fantasy:'판타지', nsfw:'수위' };

function renderConfig(){
  const body = document.getElementById('configBody');
  body.innerHTML = Object.keys(configLabels).map(key => {
    const items = data[key] || [];
    const offList = disabled[key] || [];
    const chips = items.map(item => {
      const off = offList.includes(item);
      return `<span class="config-chip${off ? ' off' : ''}" onclick="toggleDisabled('${key}','${item.replace(/'/g,"\\'")}')">${item}</span>`;
    }).join('');
    return `<div class="config-group"><div class="config-group-title">${configLabels[key]}<span class="config-count">${items.length - offList.length}/${items.length}</span></div><div class="config-chips">${chips}</div></div>`;
  }).join('');
}
function toggleDisabled(key,item){
  disabled[key] = disabled[key] || [];
  const idx = disabled[key].indexOf(item);
  if(idx === -1) disabled[key].push(item); else disabled[key].splice(idx,1);
  saveDisabled();
  renderConfig();
}
function openConfig(){
  renderConfig();
  document.getElementById('configBackdrop').classList.add('open');
  document.getElementById('configModal').classList.add('open');
}
function closeConfig(){
  document.getElementById('configBackdrop').classList.remove('open');
  document.getElementById('configModal').classList.remove('open');
}
function activeArr(key){
  return (data[key] || []).filter(v => !(disabled[key] || []).includes(v));
}
function pick(arr){ return arr.length ? arr[Math.floor(Math.random()*arr.length)] : null; }
function pickTwo(arr){
  if(!arr.length) return [];
  if(arr.length===1) return [arr[0],arr[0]];
  const i=Math.floor(Math.random()*arr.length);
  let j=Math.floor(Math.random()*(arr.length-1)); if(j>=i) j++;
  return [arr[i],arr[j]];
}
function pickN(arr,n){
  const copy=[...arr], out=[]; n=Math.min(n,copy.length);
  for(let k=0;k<n;k++) out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);
  return out;
}
function showResult(id,v){
  document.getElementById(id).innerHTML=v
    ? `<div class="main">${v}</div>` : `<div class="empty">사용 가능한 키워드가 없어요</div>`;
}

function toggleLock(key){
  locked[key] = !locked[key];
  const btn = document.getElementById(key + 'LockBtn');
  if(btn) btn.classList.toggle('active', locked[key]);
  showToast(locked[key] ? '이 키워드를 고정했어요 🔒' : '고정을 해제했어요');
}


function rollAll(){
  if(!locked.genre) rollGenre();
  if(!locked.relationship) rollRelationship();
  if(!locked.character){
    rollCharacterPair();
  }
  if(!locked.gongsu){
    rollGong();
    rollSu();
  }
  if(!locked.setting) rollSetting();
  if(!locked.fantasy) rollFantasy();
  if(!locked.nsfw) rollNsfw();
}

function rollGenre(){ const v=pick(activeArr('genre')); if(v){current['장르']=v;showResult('genreResult',v);} }
function rollCharacterA(){ window.characterTarget='A'; const v=pick(activeArr('character')); if(v){current['캐릭터A']=v;showResult('characterAResult',v);} }
function rollCharacterB(){ window.characterTarget='B'; const v=pick(activeArr('character')); if(v){current['캐릭터B']=v;showResult('characterBResult',v);} }
function rollCharacterPair(){
  const [a,b]=pickTwo(activeArr('character')); if(!a) return;
  current['캐릭터A']=a; current['캐릭터B']=b;
  showResult('characterAResult',a); showResult('characterBResult',b);
}
function rollRelationship(){ const v=pick(activeArr('relationship')); if(v){current['관계']=v;showResult('relationshipResult',v);} }
function rollSetting(){ const v=pick(activeArr('setting')); if(v){current['소재']=v;showResult('settingResult',v);} }
function rollGong(){ const v=pick(activeArr('gong')); if(v){current['공']=v;showResult('gongResult',v);} }
function rollSu(){ const v=pick(activeArr('su')); if(v){current['수']=v;showResult('suResult',v);} }
function rollFantasy(){
  const [a,b]=pickTwo(activeArr('fantasy')); if(!a) return;
  current['판타지']=`${a} × ${b}`;
  document.getElementById('fantasyResult').innerHTML=`<div class="main">${a}<span class="x">×</span>${b}</div>`;
}
function rollNsfw(){
  const arr=pickN(activeArr('nsfw'),2); if(!arr.length) return;
  current['수위키워드']=arr.join(' · '); showResult('nsfwResult',arr.join(' · '));
}

function selectKeyword(key,item){
  if(key==='character'){
    if(!current['캐릭터A']){ current['캐릭터A']=item; showResult('characterAResult',item); }
    else if(!current['캐릭터B']){ current['캐릭터B']=item; showResult('characterBResult',item); }
    else { current['캐릭터A']=item; showResult('characterAResult',item); }
    return;
  }
  const map={genre:['장르','genreResult'],relationship:['관계','relationshipResult'],setting:['소재','settingResult'],gong:['공','gongResult'],su:['수','suResult'],nsfw:['수위키워드','nsfwResult']};
  if(map[key]){ current[map[key][0]]=item; showResult(map[key][1],item); return; }
  if(key==='fantasy'){ current['판타지']=item; showResult('fantasyResult',item); }
}

function selectKeyword(key, value){
  if(key === 'character'){
    // 캐릭터 목록에서 하나를 누르면 A/B 중 현재 선택된 대상에 적용
    const target = window.characterTarget || 'A';
    const resultId = target === 'B' ? 'characterBResult' : 'characterAResult';
    const label = target === 'B' ? '캐릭터B' : '캐릭터A';
    current[label] = value;
    document.getElementById(resultId).innerHTML = `<div class="main">${value}</div>`;
    window.characterTarget = target === 'B' ? 'A' : 'B';
    return;
  }

  const map = {genre:'장르', relationship:'관계', setting:'소재', fantasy:'판타지', nsfw:'수위키워드'};
  if(key === 'gongsu'){
    const target = value.endsWith('공') ? '공' : '수';
    current[target] = value;
    document.getElementById(target === '공' ? 'gongResult' : 'suResult').innerHTML =
      `<div class="main">${value}</div>`;
    return;
  }
  if(map[key]){
    current[map[key]] = value;
    const el = document.getElementById(key + 'Result');
    if(el) el.innerHTML = `<div class="main">${value}</div>`;
  }
}


function toggleList(key){
  const el = document.getElementById(key+'List');
  const btn = document.getElementById(key+'ListBtn');
  const isOpen = el.classList.contains('open');
  if(isOpen){
    el.classList.remove('open');
    btn.classList.remove('active');
    return;
  }
  if(el.children.length === 0){
    const arr = [...data[key]].sort((a,b) => a.localeCompare(b, 'ko'));
    const prefix = key === 'character'
      ? `<span class="chip" onclick="rollCharacterPair()">A+B 같이 뽑기</span>`
      : '';
    el.innerHTML = prefix + arr.map(item => {
      const safe = String(item).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      return `<span class="chip" onclick="selectKeyword('${key}','${safe}')">${item}</span>`;
    }).join('') +
      `<div class="count" style="width:100%">총 ${arr.length}개</div>`;
  }
  el.classList.add('open');
  btn.classList.add('active');
}

// ── Firebase (저장/보관함 동기화) ─────────────────
// 아래 firebaseConfig 값을 본인 프로젝트 값으로 채워넣으세요.
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
};
let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch(e) { console.warn('firebase 미설정', e); }

let saves = []; // [{id, keywords:{label:value}, memo, createdAt}]

function loadLocal(){
  const raw = localStorage.getItem('plot_saves');
  saves = raw ? JSON.parse(raw) : [];
}
function persistLocal(){
  localStorage.setItem('plot_saves', JSON.stringify(saves));
}
async function loadSaves(){
  loadLocal();
  if(db){
    try {
      const snap = await db.collection('plot_saves').orderBy('createdAt','desc').get();
      if(!snap.empty){
        saves = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        persistLocal();
      }
    } catch(e){ console.warn('firestore 로드 실패', e); }
  }
}
loadSaves();

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function saveCurrent(){
  const keywords = { ...current };
  if(Object.keys(keywords).length === 0){
    showToast('먼저 키워드를 뽑아주세요');
    return;
  }

  // 로컬 저장을 먼저 완료해서 Firebase 설정/네트워크 문제와 관계없이 저장되게 함
  const entry = {
    id: 'local_' + Date.now(),
    keywords,
    memo: '',
    createdAt: Date.now()
  };
  saves.unshift(entry);
  persistLocal();
  renderSheet();

  // Firebase는 백그라운드에서 동기화만 시도
  if(db){
    db.collection('plot_saves').add({
      keywords,
      memo: '',
      createdAt: entry.createdAt
    }).then(ref => {
      entry.id = ref.id;
      persistLocal();
    }).catch(e => {
      console.warn('firestore 저장 실패 — 로컬 저장은 완료됨', e);
    });
  }

  showToast('저장했어요 💾');
}

function updateSave(id, patch){
  const idx = saves.findIndex(s=>s.id===id);
  if(idx<0) return;
  saves[idx] = { ...saves[idx], ...patch };
  persistLocal();
  if(db) db.collection('plot_saves').doc(id).set(saves[idx], {merge:true}).catch(e=>console.warn(e));
}
function deleteSave(id){
  saves = saves.filter(s=>s.id!==id);
  persistLocal();
  if(db) db.collection('plot_saves').doc(id).delete().catch(e=>console.warn(e));
  renderSheet();
}
function removeKeyword(id, label){
  const s = saves.find(s=>s.id===id);
  if(!s) return;
  delete s.keywords[label];
  updateSave(id, { keywords: s.keywords });
  renderSheet();
}


function autoResizeMemo(el){
  el.style.height = 'auto';
  el.style.height = Math.max(72, el.scrollHeight) + 'px';
}

function renderSheet(){
  const body = document.getElementById('sheetBody');
  if(saves.length === 0){
    body.innerHTML = `<div class="sheet-empty">아직 저장된 키워드가 없어요<br>뽑은 후 '저장' 버튼을 눌러보세요</div>`;
    return;
  }
  body.innerHTML = saves.map(s => {
    const date = new Date(s.createdAt).toLocaleString('ko-KR', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const chips = Object.entries(s.keywords).map(([label,val]) =>
      `<span class="save-chip">${val}<button class="rm" onclick="removeKeyword('${s.id}','${label}')">✕</button></span>`
    ).join('');
    return `
    <div class="save-item">
      <div class="date">${date}</div>
      <div class="save-chips">${chips || '<span style=\"color:#c2b9ac;font-size:12px\">키워드 없음</span>'}</div>
      <textarea class="save-memo" placeholder="메모 남기기…"
        oninput="autoResizeMemo(this)"
        onblur="updateSave('${s.id}',{memo:this.value})">${s.memo||''}</textarea>
      <div class="save-item-foot"><button class="save-del" onclick="deleteSave('${s.id}')">삭제</button></div>
    </div>`;
  }).join('');
  document.querySelectorAll('.save-memo').forEach(autoResizeMemo);
}

function openSheet(){
  renderSheet();
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetBackdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
</script>
